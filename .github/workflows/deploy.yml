name: Deploy PROD

# vm2 (runner conaf-prod). Solo por PR uat -> main aprobado; espera vars.SERVIDOR_LISTO.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    uses: Sud-Austral/coipo_jueces/.github/workflows/verificar.yml@v2
    with: { modo: advisory, perfil: aplicacion, runner: conaf-ci }
  suite:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: [verificar, suite]
    if: ${{ vars.SERVIDOR_LISTO == 'true' }}
    uses: Sud-Austral/infra-docker-base/.github/workflows/deploy.yml@main
    with:
      app_name: ${{ github.event.repository.name }}
